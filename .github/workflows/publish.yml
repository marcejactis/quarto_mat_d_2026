name: Publicar Apunte en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: main # Se ejecuta automáticamente al hacer push o merge a la rama principal

# Fuerza a que todas las acciones se ejecuten bajo el motor de Node 24 de manera inmediata
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso crucial para que la acción pueda escribir y actualizar la rama gh-pages
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Configuración de Python y sus dependencias científicas
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Sincronizado con su entorno de desarrollo
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter
          pip install -r requirements.txt
          # Registramos de forma explícita el kernel python3 en el runner de GitHub
          python -m ipykernel install --user

      # # Configuración de R y los paquetes del motor de renderizado (knitr)
      # - name: Set up R
      #   uses: r-lib/actions/setup-r@v2
      #   with:
      #     use-public-rspm: true # Acelera la descarga de paquetes binarios en Linux

      # - name: Install R Packages
      #   run: |
      #     install.packages(c("knitr", "rmarkdown", "reticulate"), repos = "https://cloud.r-project.org")
      #   shell: Rscript {0}

      # Configuración de Quarto CLI
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27 # Su versión de Quarto para evitar discrepancias de compilación

      # Renderizado y despliegue automático en la rama gh-pages
      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Token autogenerado por GitHub para dar permisos de escritura